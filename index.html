<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BookShelf V1.2</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{margin:0;background:#f3eee3;color:#26312c;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:620px;margin:auto;padding:28px 18px 100px}h1,h2{font-family:Georgia,serif;font-weight:500}.search,.chip,.action,.book{border:1px solid #26312c22;background:#ffffff80;border-radius:15px}.search{padding:12px;margin:15px 0}.search input{border:0;background:none;outline:0;width:90%;font-size:16px}.chips{display:flex;gap:8px;overflow:auto}.chip{padding:8px 12px}.active,.primary{background:#24554b;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}.book{padding:7px;text-align:left}.cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px}.booktitle{font-size:12px;font-weight:600;margin-top:7px}.author{font-size:10px;color:#69716c}.add{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#24554b;color:white;border:0;border-radius:18px;padding:14px 22px}.overlay{display:none;position:fixed;inset:0;background:#0005;align-items:end}.sheet{background:#f3eee3;width:100%;max-width:620px;margin:auto;border-radius:24px 24px 0 0;padding:20px;box-sizing:border-box;max-height:90vh;overflow:auto}.close{float:right;border:0;background:none;font-size:24px}.action{width:100%;padding:14px;margin:6px 0;text-align:left}.meta{background:#ffffff80;border-radius:15px;padding:12px;margin:12px 0}.meta div{display:flex;justify-content:space-between;padding:7px;border-bottom:1px solid #26312c22}.meta input{width:55%;border:0;background:#fff8;padding:6px}.progress{display:flex;gap:6px}.dot{height:4px;flex:1;background:#d7d0c3}.on{background:#24554b}
</style></head><body>
<div class="app"><h1>BookShelf</h1><div id="count"></div>
<div class="search">⌕ <input id="q" placeholder="Cerca libri, autori, ISBN…" oninput="render()"></div>
<div class="chips"><button class="chip active" onclick="setF('all')">Tutti</button><button class="chip" onclick="setF('personal')">Personali</button><button class="chip" onclick="setF('work')">Studio/Lavoro</button><button class="chip" onclick="setF('ebook')">Ebook</button></div>
<h2>I tuoi libri</h2><div id="grid" class="grid"></div></div>
<button class="add" onclick="addBook()">＋ Aggiungi libro</button>
<div id="ov" class="overlay"><div id="sh" class="sheet"></div></div>
<script>
const seed=[{t:"La diva Julia",a:"W. Somerset Maugham",isbn:"9788845919978",cat:"Personale",fmt:"Cartaceo",s:"Narrativa",ss:"Letteratura inglese",pub:"Adelphi",year:"2005",pages:"275",img:"https://covers.openlibrary.org/b/isbn/9788845919978-M.jpg"}];
let books=JSON.parse(localStorage.getItem("bookshelf_books")||"null")||seed,filter="all",scanner=null;
function render(){let q=(document.getElementById("q").value||"").toLowerCase();let a=books.filter(b=>(filter=="all"||(filter=="personal"&&b.cat=="Personale")||(filter=="work"&&b.cat=="Studio / Lavoro")||(filter=="ebook"&&b.fmt=="Ebook"))&&JSON.stringify(b).toLowerCase().includes(q));document.getElementById("count").textContent=books.length+" libri";document.getElementById("grid").innerHTML=a.map(b=>'<button class="book" onclick="showBook('+books.indexOf(b)+')"><img class="cover" src="'+b.img+'"><div class="booktitle">'+b.t+'</div><div class="author">'+b.a+'</div></button>').join("")||"<p>Nessun libro trovato.</p>"}
function setF(x){filter=x;render()}
function openS(x){ov.style.display="flex";sh.innerHTML=x}function closeS(){stopScanner();ov.style.display="none"}
function addBook(){openS('<button class="close" onclick="closeS()">×</button><h2>Aggiungi libro</h2><button class="action primary" onclick="startScan()">📷 Scansiona ISBN</button><button class="action" onclick="manual()">＋ Inserisci manualmente</button>')}
async function startScan(){openS('<button class="close" onclick="closeS()">×</button><h2>Scansiona ISBN</h2><p>Se Safari chiede il permesso, premi Consenti.</p><div id="reader" style="min-height:240px;background:#202824;border-radius:18px;overflow:hidden"></div><div class="progress"><div class="dot on"></div><div class="dot on"></div><div class="dot"></div></div><p>Inquadra il codice ISBN.</p><button class="action" onclick="manual()">Inserisci ISBN manualmente</button>');try{scanner=new Html5Qrcode("reader");await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:280,height:120},formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13]},code=>{let x=code.replace(/\D/g,"");stopScanner();lookup(x)},()=>{})}catch(e){document.getElementById("reader").innerHTML="<p style='color:white;padding:20px'>⚠️ Fotocamera non disponibile. Controlla il permesso di Safari.</p>"}}
async function stopScanner(){if(scanner){try{await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null}}
function stopScanner(){if(scanner){try{scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}scanner=null}}
async function lookup(isbn){openS("<h2>Recupero informazioni…</h2><p>"+isbn+"</p>");try{let r=await fetch("https://openlibrary.org/search.json?isbn="+isbn+"&limit=1"),d=await r.json(),b=d.docs[0];if(!b)throw 0;let book={t:b.title||"Titolo",a:b.author_name?.[0]||"Autore",isbn,cat:"Personale",fmt:"Cartaceo",s:"Narrativa",ss:"Da verificare",pub:b.publisher?.[0]||"",year:b.first_publish_year||"",pages:b.number_of_pages_median||"",img:b.cover_i?"https://covers.openlibrary.org/b/id/"+b.cover_i+"-M.jpg":"https://covers.openlibrary.org/b/isbn/"+isbn+"-M.jpg"};openS('<button class="close" onclick="closeS()">×</button><h2>Libro trovato ✓</h2><div class="meta"><div>Titolo <b>'+book.t+'</b></div><div>Autore <b>'+book.a+'</b></div><div>Editore <b>'+book.pub+'</b></div><div>Anno <b>'+book.year+'</b></div><div>ISBN <b>'+isbn+'</b></div></div><button class="action primary" onclick='saveBook('+JSON.stringify(JSON.stringify(book))+')'>＋ Aggiungi alla biblioteca</button>')}catch(e){openS("<h2>ISBN non trovato</h2><button class='action' onclick='manual()'>Inserisci manualmente</button>")}}
function saveBook(s){let b=JSON.parse(s);if(!books.some(x=>x.isbn==b.isbn)){books.push(b);localStorage.setItem("bookshelf_books",JSON.stringify(books));render()}closeS()}
function manual(){openS('<button class="close" onclick="closeS()">×</button><h2>Inserimento manuale</h2><div class="meta"><div>ISBN <input id="mi"></div><div>Titolo <input id="mt"></div><div>Autore <input id="ma"></div></div><button class="action primary" onclick="manualSave()">Salva libro</button>')}
function manualSave(){saveBook(JSON.stringify({isbn:mi.value,t:mt.value||"Senza titolo",a:ma.value||"Autore non indicato",cat:"Personale",fmt:"Ebook",s:"Da classificare",ss:"Da verificare",img:mi.value?"https://covers.openlibrary.org/b/isbn/"+mi.value+"-M.jpg":""}))}
function showBook(i){let b=books[i];openS('<button class="close" onclick="closeS()">×</button><h2>'+b.t+'</h2><p>'+b.a+'</p><div class="meta"><div>Formato <b>'+b.fmt+'</b></div><div>Tipo <b>'+b.cat+'</b></div><div>Settore <b>'+b.s+'</b></div><div>Sottosettore <b>'+b.ss+'</b></div><div>ISBN <b>'+(b.isbn||"—")+'</b></div></div>')}
render();
</script></body></html>
