<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3eee3">
<title>Biblioteca — V1</title>
<style>
:root{
  --paper:#f3eee3; --paper2:#eee7d9; --ink:#26312c; --muted:#69716c;
  --green:#24554b; --line:rgba(38,49,44,.13); --card:rgba(255,255,255,.48);
  --shadow:0 8px 30px rgba(45,45,35,.08);
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{background-image:radial-gradient(rgba(70,60,40,.045) .7px,transparent .7px);background-size:7px 7px}
button,input{font:inherit} button{cursor:pointer}
.app{max-width:620px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(88px + env(safe-area-inset-bottom))}
header{padding:22px 2px 12px;display:flex;align-items:end;justify-content:space-between}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}
h1{font-family:Georgia,serif;font-weight:500;font-size:31px;margin:4px 0 0}
.count{font-size:13px;color:var(--muted)}
.icon{border:1px solid var(--line);background:rgba(255,255,255,.45);width:42px;height:42px;border-radius:14px;color:var(--green);font-size:23px}
.search{margin:8px 0 14px;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:16px;color:var(--ink)}
.search span{color:var(--muted)}
.chips{display:flex;gap:8px;overflow:auto;padding:0 1px 15px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 12px;color:var(--muted);font-size:13px}
.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:2px 0 14px}
.sort{border:0;background:transparent;color:var(--green);font-size:13px}
.sectiontitle{font-family:Georgia,serif;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.book{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px;box-shadow:0 4px 18px rgba(45,45,35,.05);text-align:left}
.cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;display:block;background:#ddd}
.booktitle{font-size:12px;font-weight:600;line-height:1.22;margin:8px 3px 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.author{font-size:10px;color:var(--muted);margin:0 3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{grid-column:1/-1;padding:38px 15px;text-align:center;color:var(--muted)}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(620px,100%);padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 22%);display:flex;justify-content:center;pointer-events:none}
.add{pointer-events:auto;background:var(--green);color:#fff;border:0;border-radius:18px;padding:14px 22px;box-shadow:0 8px 24px rgba(36,85,75,.25);font-weight:650}
.overlay{position:fixed;inset:0;background:rgba(30,35,31,.35);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:min(620px,100%);background:var(--paper);border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet h2{font-family:Georgia,serif;font-weight:500;margin:0 0 6px;font-size:25px}.sheet p{color:var(--muted);margin:0 0 18px;font-size:14px}
.action{width:100%;padding:14px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.5);margin:6px 0;text-align:left;color:var(--ink)}
.action.primary{background:var(--green);color:white;border-color:var(--green)}
.close{float:right;border:0;background:transparent;font-size:22px;color:var(--muted)}
.progress{display:flex;gap:7px;margin:17px 0}.dot{height:4px;flex:1;border-radius:5px;background:#d6d0c3}.dot.on{background:var(--green)}
.status{font-family:Georgia,serif;font-size:20px;margin:16px 0}
.meta{background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:12px}
.meta div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.meta div:last-child{border:0}.meta span{color:var(--muted)}
.small{font-size:12px;color:var(--muted);line-height:1.5}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><div class="eyebrow">La mia biblioteca</div><h1>Biblioteca</h1><div class="count" id="count"></div></div>
  <button class="icon" onclick="openAdd()">＋</button>
</header>

<div class="search"><span>⌕</span><input id="q" placeholder="Cerca libri, autori, ISBN…" oninput="render()"></div>
<div class="chips">
  <button class="chip active" data-filter="all" onclick="setFilter('all')">Tutti</button>
  <button class="chip" data-filter="personal" onclick="setFilter('personal')">Personali</button>
  <button class="chip" data-filter="work" onclick="setFilter('work')">Studio / Lavoro</button>
  <button class="chip" data-filter="paper" onclick="setFilter('paper')">Cartacei</button>
  <button class="chip" data-filter="ebook" onclick="setFilter('ebook')">Ebook</button>
</div>

<div class="toolbar"><div class="sectiontitle">I tuoi libri</div><button class="sort" onclick="cycleSort()">Ultimi aggiunti ▾</button></div>
<div class="grid" id="grid"></div>
</div>

<div class="bottom"><button class="add" onclick="openAdd()">＋ Aggiungi libro</button></div>

<div class="overlay" id="overlay">
 <div class="sheet" id="sheet"></div>
</div>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script>
const initialBooks = [
  {t:"La diva Julia",a:"W. Somerset Maugham",cat:"Personale",fmt:"Cartaceo",s:"Narrativa",ss:"Letteratura inglese",img:"https://covers.openlibrary.org/b/isbn/9788845919978-M.jpg",n:8,isbn:"9788845919978",pub:"Adelphi",year:"2005",pages:"275"},
  {t:"Dune",a:"Frank Herbert",cat:"Personale",fmt:"Cartaceo",s:"Fantascienza",ss:"Space opera",img:"https://covers.openlibrary.org/b/isbn/9788834738248-M.jpg",n:6},
  {t:"1984",a:"George Orwell",cat:"Personale",fmt:"Ebook",s:"Narrativa",ss:"Distopico",img:"https://covers.openlibrary.org/b/isbn/9780451524935-M.jpg",n:5},
  {t:"Interstellar",a:"Greg Keyes",cat:"Personale",fmt:"Ebook",s:"Fantascienza",ss:"Spazio / Cinema",img:"https://covers.openlibrary.org/b/isbn/9781785658089-M.jpg",n:4},
  {t:"Il processo",a:"Franz Kafka",cat:"Personale",fmt:"Cartaceo",s:"Narrativa",ss:"Classici",img:"https://covers.openlibrary.org/b/isbn/9780142437239-M.jpg",n:3},
  {t:"Manuale di diritto civile",a:"Autori vari",cat:"Studio / Lavoro",fmt:"Cartaceo",s:"Diritto",ss:"Civile",img:"https://covers.openlibrary.org/b/isbn/9788821767715-M.jpg",n:2},
  {t:"Codice civile",a:"—",cat:"Studio / Lavoro",fmt:"Cartaceo",s:"Diritto",ss:"Civile",img:"https://covers.openlibrary.org/b/isbn/9788813376768-M.jpg",n:1},
  {t:"Sapiens",a:"Yuval Noah Harari",cat:"Personale",fmt:"Ebook",s:"Storia",ss:"Storia dell'umanità",img:"https://covers.openlibrary.org/b/isbn/9780062316097-M.jpg",n:0}
];
let books = JSON.parse(localStorage.getItem('bookshelf_books') || 'null') || initialBooks;
let filter="all", sort="recent", scannerControls=null;

function saveBooks(){ localStorage.setItem('bookshelf_books', JSON.stringify(books)); }
function setFilter(x){filter=x;document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.filter===x));render();}
function cycleSort(){sort=sort==='recent'?'title':sort==='title'?'author':'recent';document.querySelector('.sort').textContent={recent:'Ultimi aggiunti ▾',title:'Titolo A → Z ▾',author:'Autore A → Z ▾'}[sort];render();}
function render(){
  const q=(document.getElementById('q')?.value||'').toLowerCase().trim();
  let arr=books.filter(b=>{
    const ok=filter==='all'||(filter==='personal'&&b.cat==='Personale')||(filter==='work'&&b.cat==='Studio / Lavoro')||(filter==='paper'&&b.fmt==='Cartaceo')||(filter==='ebook'&&b.fmt==='Ebook');
    const text=[b.t,b.a,b.isbn||'',b.pub||'',b.s,b.ss,b.cat,b.fmt].join(' ').toLowerCase();
    return ok&&(!q||text.includes(q));
  });
  if(sort==='recent')arr.sort((a,b)=>(b.n||0)-(a.n||0));
  if(sort==='title')arr.sort((a,b)=>a.t.localeCompare(b.t,'it'));
  if(sort==='author')arr.sort((a,b)=>a.a.localeCompare(b.a,'it'));
  document.getElementById('count').textContent=books.length+' libri · '+books.filter(b=>b.fmt==='Ebook').length+' ebook';
  document.getElementById('grid').innerHTML=arr.length?arr.map(b=>`<button class="book" onclick="showBook(${books.indexOf(b)})"><img class="cover" src="${b.img||''}" alt="" onerror="this.style.opacity='.18'"><div class="booktitle">${escapeHtml(b.t)}</div><div class="author">${escapeHtml(b.a)}</div></button>`).join(''):`<div class="empty">Nessun libro trovato.<br><br>Prova un altro termine o cambia filtro.</div>`;
}
function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function openSheet(content){document.getElementById('overlay').style.display='flex';document.getElementById('sheet').innerHTML=content;}
function closeSheet(){stopScanner();document.getElementById('overlay').style.display='none';}

aSyncNoop = null;
function openAdd(){
  openSheet(`<button class="close" onclick="closeSheet()">×</button><h2>Aggiungi libro</h2><p>Lascia che sia l'app a fare il lavoro.</p><button class="action primary" onclick="startScanner()">📷 &nbsp; Scansiona ISBN</button><button class="action" onclick="manualIsbn()">⌨️ &nbsp; Inserisci ISBN</button><button class="action" onclick="manual()">＋ &nbsp; Inserisci manualmente</button><p class="small">La scansione usa la fotocamera del tuo iPhone. Al primo utilizzo Safari chiederà il permesso.</p>`);
}
function startScanner(){
  openSheet(`<button class="close" onclick="closeSheet()">×</button><h2>Scansiona ISBN</h2><p>Consenti l'accesso alla fotocamera e inquadra il codice a barre.</p><div style="position:relative;overflow:hidden;border-radius:20px;background:#18231f;min-height:230px"><video id="scannerVideo" autoplay muted playsinline style="width:100%;height:230px;object-fit:cover"></video><div style="position:absolute;left:10%;right:10%;top:50%;height:2px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.7)"></div></div><div class="progress"><div class="dot on"></div><div class="dot"></div><div class="dot"></div></div><div id="scanStatus" class="small">In attesa della fotocamera…</div><button class="action" onclick="manualIsbn()">Inserisci ISBN a mano</button>`);
  const video=document.getElementById('scannerVideo');
  if(!video){return;}
  if(!window.ZXingBrowser){
    document.getElementById('scanStatus').textContent='Lettore barcode non disponibile. Puoi inserire l’ISBN a mano.'; return;
  }
  try{
    const reader=new ZXingBrowser.BrowserMultiFormatReader();
    scannerControls=reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}},audio:false},video,(result,err)=>{
      if(result){ const raw=result.getText(); const isbn=normalizeISBN(raw); if(isbn){ stopScanner(); lookupISBN(isbn); } }
    });
    Promise.resolve(scannerControls).catch(()=>{});
    document.getElementById('scanStatus').textContent='Fotocamera attiva · inquadra il codice ISBN';
  }catch(e){
    document.getElementById('scanStatus').textContent='Impossibile avviare la fotocamera. Usa “Inserisci ISBN a mano”.';
  }
}
function stopScanner(){
  try{ if(scannerControls&&typeof scannerControls.stop==='function')scannerControls.stop(); }catch(e){}
  scannerControls=null;
  const v=document.getElementById('scannerVideo');
  if(v&&v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null;}
}
function manualIsbn(){
  stopScanner();
  openSheet(`<button class="close" onclick="closeSheet()">×</button><h2>Inserisci ISBN</h2><p>Puoi digitare le 10 o 13 cifre.</p><input id="isbnInput" inputmode="numeric" placeholder="9788845919978" style="width:100%;padding:14px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.6);outline:0"><button class="action primary" onclick="doManualIsbn()">Cerca libro</button><div id="isbnError" class="small"></div>`);
}
function doManualIsbn(){const isbn=normalizeISBN(document.getElementById('isbnInput').value);if(!isbn){document.getElementById('isbnError').textContent='ISBN non valido.';return;}lookupISBN(isbn);}
function normalizeISBN(raw){
  let s=String(raw||'').replace(/[^0-9Xx]/g,'').toUpperCase();
  if(s.length===13&&s.startsWith('978')) return s;
  if(s.length===10){
    const body=s.slice(0,9);let sum=0;for(let i=0;i<9;i++)sum+=(10-i)*Number(body[i]);let check=(11-(sum%11))%11;let c=check===10?'X':String(check);if(c===s[9]){let x='978'+body;let total=0;for(let i=0;i<12;i++)total+=Number(x[i])*(i%2?3:1);return x+(10-(total%10))%10;}}
  return null;
}
async function lookupISBN(isbn){
  openSheet(`<button class="close" onclick="closeSheet()">×</button><h2>Recupero informazioni</h2><div class="progress"><div class="dot on"></div><div class="dot on"></div><div class="dot"></div></div><div class="status">Cerco il libro…</div><div class="small">ISBN ${isbn}</div>`);
  try{
    let data=null;
    const r=await fetch('https://openlibrary.org/api/books?bibkeys=ISBN:'+isbn+'&jscmd=data&format=json');
    if(r.ok){const all=await r.json();data=all['ISBN:'+isbn]||null;}
    if(!data){
      const r2=await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn);
      if(r2.ok){const g=await r2.json();if(g.items&&g.items[0])data=googleToBook(g.items[0].volumeInfo,isbn);}
    }
    if(!data)throw new Error('not found');
    const b=normalizeBook(data,isbn);showFoundBook(b);
  }catch(e){
    openSheet(`<button class="close" onclick="closeSheet()">×</button><h2>ISBN non trovato</h2><p>Non ho trovato dati bibliografici online per <b>${isbn}</b>.</p><button class="action primary" onclick="manualIsbn()">Prova un altro ISBN</button><button class="action" onclick="manual()">Inserisci il libro manualmente</button>`);
  }
}
function googleToBook(v,isbn){return {title:v.title,authors:v.authors||[],publishers:v.publisher?[v.publisher]:[],publish_date:v.publishedDate,number_of_pages:v.pageCount,cover:{medium:v.imageLinks?.thumbnail},subjects:v.categories||[],isbn:isbn};}
function normalizeBook(d,isbn){
  const title=d.title||d.name||'Titolo non disponibile';
  const authors=(d.authors||[]).map(x=>typeof x==='string'?x:(x.name||'')).filter(Boolean);
  const subjects=(d.subjects||d.categories||[]).map(x=>typeof x==='string'?x:(x.name||x.title||'')).filter(Boolean);
  let img=d.cover?.medium||d.cover?.large||d.cover?.small||`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg`; img=String(img).replace(/^http:/,'https:');
  const cls=classify(title,subjects);
  return {t:title,a:authors.join(', ')||'Autore non disponibile',cat:'Personale',fmt:'Cartaceo',s:cls.s,ss:cls.ss,img,n:Date.now(),isbn,pub:(d.publishers&&d.publishers[0])||'',year:String(d.publish_date||'').slice(0,4),pages:d.number_of_pages||''};
}
function classify(title,subjects){
  const text=(title+' '+subjects.join(' ')).toLowerCase();
  if(/diritto|codice civile|civile|penale|amministrativo|costituzionale/.test(text))return{s:'Diritto',ss:/penale/.test(text)?'Penale':'Civile'};
  if(/astronom|fisica|matematic|scienza|science/.test(text))return{s:'Scienze',ss:/astronom/.test(text)?'Astronomia':'Scienze'};
  if(/storia|history|medioevo|romano|antichità/.test(text))return{s:'Storia',ss:'Storia generale'};
  if(/fantascienza|science fiction|sci-fi|dystop|distopia|space opera/.test(text))return{s:'Narrativa',ss:'Fantascienza'};
  if(/giallo|mistero|thriller|detective/.test(text))return{s:'Narrativa',ss:'Giallo / Thriller'};
  return{s:'Narrativa',ss:'Da verificare'};
}
function showFoundBook(b){
  openSheet(`<button class="close" onclick="closeSheet()">×</button><h2>Libro trovato ✓</h2><p>${escapeHtml(b.a)}</p><div class="meta"><div><span>Titolo</span><b>${escapeHtml(b.t)}</b></div><div><span>Autore</span><b>${escapeHtml(b.a)}</b></div><div><span>Editore</span><b>${escapeHtml(b.pub||'—')}</b></div><div><span>Anno</span><b>${escapeHtml(b.year||'—')}</b></div><div><span>Settore</span><b>${escapeHtml(b.s)}</b></div><div><span>Sottosettore</span><b>${escapeHtml(b.ss)}</b></div><div><span>ISBN</span><b>${b.isbn}</b></div></div><button class="action primary" onclick='addBook(${JSON.stringify(b).replace(/'/g,"&#39;")})'>＋ Aggiungi alla biblioteca</button><p class="small">La classificazione è una proposta automatica e potrà essere modificata.</p>`);
}
function addBook(b){
  const exists=books.find(x=>x.isbn===b.isbn);
  if(exists){showBook(books.indexOf(exists));return;}
  books.push(b);saveBooks();render();closeSheet();
}
function manual(){
  openSheet(`<button class="close" onclick="closeSheet()">×</button><h2>Inserimento manuale</h2><p>Per ebook o libri senza ISBN.</p><input id="mt" placeholder="Titolo" style="width:100%;padding:13px;margin:4px 0;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.6)"><input id="ma" placeholder="Autore" style="width:100%;padding:13px;margin:4px 0;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.6)"><button class="action primary" onclick="saveManual()">Salva libro</button>`);
}
function saveManual(){const t=document.getElementById('mt').value.trim(),a=document.getElementById('ma').value.trim();if(!t)return;books.push({t,a:a||'—',cat:'Personale',fmt:'Ebook',s:'Da classificare',ss:'Da verificare',img:'',n:Date.now()});saveBooks();render();closeSheet();}
function showBook(i){
  const b=books[i];
  openSheet(`<button class="close" onclick="closeSheet()">×</button><h2>${escapeHtml(b.t)}</h2><p>${escapeHtml(b.a)}</p><div class="meta"><div><span>Formato</span><b>${escapeHtml(b.fmt)}</b></div><div><span>Tipo</span><b>${escapeHtml(b.cat)}</b></div><div><span>Settore</span><b>${escapeHtml(b.s)}</b></div><div><span>Sottosettore</span><b>${escapeHtml(b.ss)}</b></div><div><span>Editore</span><b>${escapeHtml(b.pub||'—')}</b></div><div><span>Anno</span><b>${escapeHtml(b.year||'—')}</b></div><div><span>Pagine</span><b>${escapeHtml(b.pages||'—')}</b></div><div><span>ISBN</span><b>${escapeHtml(b.isbn||'—')}</b></div></div><button class="action" onclick="closeSheet()">Modifica</button>`);
}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet();});
render();
</script>
</body>
</html>
